name: Portfolio checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  atelier-test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/atelier-edit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/atelier-edit/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
